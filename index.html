<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIGER-CYBR-AI | المستودع المستقبلي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #020205; 
            color: #ffffff; 
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 📺 خلفية فيديو حية مدمجة للموقع بالكامل */
        .video-bg {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; pointer-events: none;
            filter: brightness(0.25) contrast(1.1); /* تعتيم الفيديو لكي يبرز الكلام والأزرار */
        }
        
        /* طبقة حماية زجاجية فوق الفيديو لمنع تشتيت العين */
        .overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 20%, #020205 90%);
            z-index: -1; pointer-events: none;
        }

        .container { width: 90%; max-width: 600px; text-align: center; z-index: 1; }
        
        h1 { font-size: 36px; font-weight: 900; margin-bottom: 40px; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h1 span { background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 🧼 تصميم الأزرار البلورية الهلامية (Liquid Glass Button) كالصورة الثانية */
        .glass-btn-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; padding: 15px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 15px; width: 100%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* حرك السائل المتوهج عند وضع الماوس أو اللمس */
        .glass-item::before {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%); transition: transform 0.6s ease;
        }
        .glass-item:hover::before { transform: translateX(100%); }
        .glass-item:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(0, 242, 254, 0.3);
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
        }

        .project-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .project-status { font-size: 12px; color: #00f2fe; letter-spacing: 1px; font-weight: bold; }

        /* 🪂 هندسة محاكي التحميل وشريط التقدم التفاعلي كالصورة الثالثة */
        .download-box {
            width: 100%; margin-top: 15px; display: none;
            background: rgba(7, 7, 15, 0.8); border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 18px; padding: 20px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1);
        }
        
        /* أنيميشن المظلة الطائرة */
        .parachute-icon { font-size: 32px; color: #00f2fe; margin-bottom: 10px; display: inline-block; }
        .animate-fall { animation: floatIcon 2s ease-in-out infinite alternate; }
        @keyframes floatIcon { 0% { transform: translateY(-5px); } 100% { transform: translateY(5px); } }

        .progress-bar-container {
            width: 100%; height: 6px; background: rgba(255,255,255,0.05);
            border-radius: 10px; margin: 15px 0; overflow: hidden; position: relative;
        }
        .progress-bar-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #00f2fe, #4facfe);
            border-radius: 10px; transition: width 0.1s linear;
            box-shadow: 0 0 10px #00f2fe;
        }
        .progress-text { font-size: 14px; font-weight: bold; color: #9ca3af; }
    </style>
</head>
<body>

    <!-- 📺 استدعاء فيديو الخلفية الحي (قم باستبدال الرابط أدناه برابط فيديو ألعابك لاحقاً) -->
    <!-- استخدمت هنا فيديو عينة ذو طابع تقني داكن ومتحرك -->
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="https://mixkit.co" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="container">
        <h1>ترسانة برمجيات <span>TIGER-CYBR-AI</span></h1>

        <!-- 🧼 لوحة الأزرار البلورية الهلامية -->
        <div class="glass-btn-container">
            
            <!-- زر المشروع الأول التفاعلي -->
            <div class="glass-item" onclick="startDownload('prog-1', 'bar-1', 'txt-1', 'box-1')">
                <div class="project-title">[ CYBER_PROTOCOL ]</div>
                <div class="project-status">اضغط لبدء محاكاة التثبيت ⚡</div>
                
                <!-- صندوق التحميل المخفي كالصورة الثالثة ويتفعل عند الضغط -->
                <div class="download-box" id="box-1" onclick="event.stopPropagation();">
                    <div class="parachute-icon animate-fall">🪂</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="bar-1"></div>
                    </div>
                    <div class="progress-text" id="txt-1">تحميل الملف: 0%</div>
                </div>
            </div>

            <!-- زر المشروع الثاني التفاعلي -->
            <div class="glass-item" onclick="startDownload('prog-2', 'bar-2', 'txt-2', 'box-2')">
                <div class="project-title">[ ENGINE_INIT_01 ]</div>
                <div class="project-status">اضغط لبدء محاكاة التثبيت ⚡</div>
                
                <div class="download-box" id="box-2" onclick="event.stopPropagation();">
                    <div class="parachute-icon animate-fall">🪂</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="bar-2"></div>
                    </div>
                    <div class="progress-text" id="txt-2">تحميل الملف: 0%</div>
                </div>
            </div>

        </div>
    </div>

    <!-- 🧠 محرك الجافا سكريبت لتشغيل العداد وشريط التقدم التفاعلي الحقيقي عند النقر -->
    <script>
        function startDownload(btnId, barId, textId, boxId) {
            const box = document.getElementById(boxId);
            const bar = document.getElementById(barId);
            const text = document.getElementById(textId);
            
            // إظهار صندوق التحميل بتأثير أنيق
            box.style.display = "block";
            
            let width = 0;
            // محاكاة سرعة العداد وشريط التقدم الرقمي
            const interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    text.innerText = "✓ اكتمل التحميل بنجاح!";
                    text.style.color = "#00f2fe";
                } else {
                    width++;
                    bar.style.width = width + '%';
                    text.innerText = "جاري تحميل وتجهيز الملف: " + width + "%";
                }
            }, 40); // سرعة العداد بالملي ثانية
        }
    </script>
</body>
</html>
