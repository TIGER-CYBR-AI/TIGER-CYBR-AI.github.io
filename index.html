<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIGER-CYBR-AI | المستودع البرمجي الفائق</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #020208; 
            color: #ffffff; 
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 🧠 خلفية حية برمجية متحركة (تأثير الفضاء الرقمي المتنفس) مضمومة للعمل على أي متصفح */
        .animated-cyber-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #0a0616 0%, #020208 80%);
            z-index: -2;
        }
        
        .animated-cyber-bg::before {
            content: ""; position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            animation: techPulse 8s linear infinite;
        }
        
        @keyframes techPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            50% { transform: scale(1.05) rotate(1deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
        }

        /* هالات الضوء النيوني السائل في الزوايا */
        .neon-glow-source {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 60%);
            bottom: -10%; right: -10%; z-index: -1;
            animation: drift 10s ease-in-out infinite alternate;
        }
        @keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-30px, -30px); } }

        .container { width: 90%; max-width: 550px; text-align: center; z-index: 1; }
        
        /* الخط المستقبلي الحاد للعناوين */
        h1 { font-size: 38px; font-weight: 900; margin-bottom: 40px; letter-spacing: -1px; }
        h1 span { background: linear-gradient(90deg, #00f2fe, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }

        /* 💎 كبسولة الأزرار المجسمة الفخمة ذات الإضاءة المحيطية المحفورة */
        .neon-capsule {
            background: #090714;
            border: 2px solid #16122c;
            border-radius: 28px; padding: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.05);
            display: flex; flex-direction: column; gap: 20px; width: 100%;
        }

        /* تصميم الزر المجسم المتوهج العاكس للضوء كالمستقبل */
        .cyber-item {
            background: linear-gradient(135deg, #120e25 0%, #080612 100%);
            border: 1px solid #221a44;
            border-radius: 20px; padding: 22px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.3);
        }

        /* شريط نيون متحرك يطوف حول الزر عند وضع الماوس */
        .cyber-item::after {
            content: ""; position: absolute; inset: 0;
            border-radius: 20px; padding: 1px;
            background: linear-gradient(90deg, transparent, #00f2fe, #a855f7, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.4s ease;
        }

        .cyber-item:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: #3b82f6;
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.15), inset 0 1px 10px rgba(0, 242, 254, 0.1);
        }
        .cyber-item:hover::after { opacity: 1; }

        .project-title { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .project-status { font-size: 13px; color: #00f2fe; font-weight: 700; letter-spacing: 0.5px; opacity: 0.9; }

        /* 🪂 صندوق شريط التقدم والعداد الرقمي التفاعلي الحقيقي */
        .download-panel {
            width: 100%; margin-top: 18px; display: none;
            background: #04020a; border: 1px solid #221a44;
            border-radius: 16px; padding: 20px; text-align: center;
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.6);
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .parachute-anim { font-size: 34px; color: #00f2fe; margin-bottom: 8px; display: inline-block; animation: bounce 1.5s ease-in-out infinite alternate; }
        @keyframes bounce { 0% { transform: translateY(-4px) rotate(-5deg); } 100% { transform: translateY(4px) rotate(5deg); } }

        .bar-bg {
            width: 100%; height: 8px; background: #110d24;
            border-radius: 20px; margin: 15px 0; overflow: hidden; border: 1px solid #1c163a;
        }
        .bar-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #00f2fe, #a855f7);
            border-radius: 20px; box-shadow: 0 0 15px #00f2fe;
        }
        .counter-text { font-size: 14px; font-weight: 800; color: #a0aec0; font-family: monospace; }
    </style>
</head>
<body>

    <!-- محرك الخلفية الرقمية الحية المدمجة -->
    <div class="animated-cyber-bg"></div>
    <div class="neon-glow-source"></div>

    <div class="container">
        <h1>ترسانة برمجيات <span>TIGER-CYBR-AI</span></h1>

        <!-- 💎 كبسولة الأزرار المجسمة النيونية -->
        <div class="neon-capsule">
            
            <!-- زر المشروع 1 التفاعلي -->
            <div class="cyber-item" onclick="triggerLaunch('bar-1', 'txt-1', 'box-1')">
                <div class="project-title">[ CYBER_PROTOCOL ]</div>
                <div class="project-status">انقر لتشغيل بروتوكول التثبيت ⚡</div>
                
                <!-- لوحة عداد شريط التقدم التفاعلي الخفي -->
                <div class="download-panel" id="box-1" onclick="event.stopPropagation();">
                    <div class="parachute-anim">🪂</div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-1"></div>
                    </div>
                    <div class="counter-text" id="txt-1">CONNECTING_SERVER: 0%</div>
                </div>
            </div>

            <!-- زر المشروع 2 التفاعلي -->
            <div class="cyber-item" onclick="triggerLaunch('bar-2', 'txt-2', 'box-2')">
                <div class="project-title">[ ENGINE_INIT_01 ]</div>
                <div class="project-status">انقر لتشغيل بروتوكول التثبيت ⚡</div>
                
                <div class="download-panel" id="box-2" onclick="event.stopPropagation();">
                    <div class="parachute-anim">🪂</div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-2"></div>
                    </div>
                    <div class="counter-text" id="txt-2">CONNECTING_SERVER: 0%</div>
                </div>
            </div>

        </div>
    </div>

    <!-- 🧠 محرك الجافا سكريبت الأصلي للعداد وشريط النيون التفاعلي -->
    <script>
        function triggerLaunch(barId, textId, boxId) {
            const box = document.getElementById(boxId);
            const bar = document.getElementById(barId);
            const text = document.getElementById(textId);
            
            box.style.display = "block";
            
            let progress = 0;
            const timer = setInterval(function() {
                if (progress >= 100) {
                    clearInterval(timer);
                    text.innerText = "✓ DOWNLOAD_COMPLETE // تم التحميل!";
                    text.style.color = "#00f2fe";
                } else {
                    progress++;
                    bar.style.width = progress + '%';
                    text.innerText = "DOWNLOADING_PACKAGE: " + progress + "%";
                }
            }, 35); // سرعة عداد شريط التقدم
        }
    </script>
</body>
</html>
